name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund --legacy-peer-deps
      - run: npm run assets:embed
      - run: git diff --exit-code -- cloudflare/src/embedded-assets.js
      - run: node --check server.js
      - run: node --check scripts/add-member.js
      - run: node --check public/audio-processing.js
      - run: node --check public/app.js
      - run: node --check public/setup.js
      - run: node --check scripts/embed-assets.js
      - run: node --check cloudflare/src/index.js
      - run: node --check cloudflare/src/embedded-assets.js
      - run: npx wrangler deploy --dry-run --config wrangler.jsonc
      - run: npm test
      - name: Build production container
        run: docker build --pull -t hamyar-heyat:ci .
