name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: node --check server.js
      - run: node --check scripts/add-member.js
      - run: node --check cloudflare/src/index.js
      - run: npx --yes wrangler@latest deploy --dry-run --config cloudflare/wrangler.jsonc
