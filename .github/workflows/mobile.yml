name: Native mobile checks

concurrency:
  group: native-mobile-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [hardening/voice-phase2-fixes]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile.yml"
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate native platform folders and apply audio configuration
        run: |
          cd mobile
          bash bootstrap.sh
      - name: Resolve dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Format, analyze and test
        working-directory: mobile
        run: |
          dart format lib test
          flutter analyze
          flutter test
      - name: Install Android SDK 37
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37"
      - name: Build Android debug APK
        working-directory: mobile
        run: flutter build apk --debug --dart-define=API_BASE_URL=https://test2.mahdi-masoumi168.workers.dev
      - uses: actions/upload-artifact@v4
        with:
          name: hamyar-heyat-android-debug
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate native platform folders and apply audio configuration
        run: |
          cd mobile
          bash bootstrap.sh
      - name: Resolve dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Format, analyze and test
        working-directory: mobile
        run: |
          dart format lib test
          flutter analyze
          flutter test
      - name: Build unsigned iOS app
        working-directory: mobile
        run: flutter build ios --no-codesign --dart-define=API_BASE_URL=https://test2.mahdi-masoumi168.workers.dev
      - name: Package iOS app
        run: |
          cd mobile/build/ios/iphoneos
          /usr/bin/zip -r "$GITHUB_WORKSPACE/hamyar-heyat-ios-unsigned.zip" Runner.app
      - uses: actions/upload-artifact@v4
        with:
          name: hamyar-heyat-ios-unsigned
          path: hamyar-heyat-ios-unsigned.zip
          if-no-files-found: error
